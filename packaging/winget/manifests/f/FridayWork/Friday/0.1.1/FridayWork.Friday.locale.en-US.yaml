ShortDescription: Open-source harness for coding agents that work as a team.
Description: |-
  Friday runs the coding agents you already use, such as Claude Code, Codex, Cursor, Gemini CLI, GitHub Copilot and OpenCode, as one team on your own computer.
  One agent splits a job into a task board and the others take parts of it, they message each other as they work, each can work in its own Git worktree, and a tool that runs out of usage hands its task to another.
  It runs on 127.0.0.1 with no account, on each tool's own plan.
