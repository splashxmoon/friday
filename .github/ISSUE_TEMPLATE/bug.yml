name: Bug report
description: Something in Friday doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Start a session in a folder with …
        2. Add Codex …
        3. …
  - type: dropdown
    id: how
    attributes:
      label: How you run Friday
      options:
        - Desktop app
        - npx github:splashxmoon/friday
        - A clone (npm start)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Computer
      placeholder: macOS 15 on Apple silicon, Windows 11, Ubuntu 24.04 …
  - type: input
    id: tools
    attributes:
      label: Coding tools involved, with versions
      placeholder: Claude Code 2.1.4, Codex 0.58 …
  - type: input
    id: version
    attributes:
      label: Friday version
      description: From the releases page, or `git rev-parse --short HEAD` in a clone.
